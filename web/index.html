<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Mini App</title>
  <!-- Must be the first script (Telegram Mini Apps docs). -->
  <script src="https://telegram.org/js/telegram-web-app.js?64"></script>
  <!-- --- recipe scripts --- -->

  <!-- LaPoe live chat: paste the snippet from your LaPoe dashboard (Mini App section) on the line below. -->

  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.png" alt="" class="logo">
      <span id="app-name">My Mini App</span>
    </div>
    <button id="support-btn" class="secondary small" type="button">Support</button>
  </header>

  <main>
    <div id="notice" class="notice error" hidden>
      <span id="notice-text"></span>
      <button id="notice-retry" class="link" type="button" hidden>Try again</button>
    </div>
    <p id="loading" class="muted">Loading…</p>

    <!-- STARTER ONLY: placeholder card. Delete this section (and renderStarter in app.js)
         when you build the app's own screens. -->
    <section class="card" id="starter" hidden>
      <h1 id="greeting"></h1>
      <p class="muted" id="visits"></p>
      <p>This is the starter screen. Describe your idea to your AI and it will build it here.</p>
      <p class="muted small">Front end: <code>web/</code> · Backend: <code>tgcloud/</code> · Guide for AI: <code>AGENTS.md</code></p>
    </section>
    <!-- END STARTER ONLY -->

    <div id="features"></div>
  </main>
</body>
</html>
